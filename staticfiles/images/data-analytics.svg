  <rect x="255" y="200" width="22" height="65" rx="3" fill="#fbbf24"/>

  <!-- Line Chart / Visualization Node -->
  <rect x="310" y="170" width="205" height="120" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <path d="M 330 250 Q 360 210 390 230 T 450 190 T 490 210" fill="none" stroke="#b6ff00" stroke-width="3"/>
  <circle cx="330" cy="250" r="4" fill="#b6ff00"/>
  <circle cx="390" cy="230" r="4" fill="#b6ff00"/>
  <circle cx="450" cy="190" r="4" fill="#b6ff00"/>
