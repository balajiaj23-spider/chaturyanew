      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#daBg)" stroke="#262626" stroke-width="2"/>
  
  <!-- Analytics Dashboard Mockup -->
