  <text x="250" y="138" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#38bdf8">98.4%</text>

  <!-- Metric Card 3 -->
  <rect x="385" y="90" width="130" height="65" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="400" y="110" font-family="sans-serif" font-size="10" fill="#94a3b8">Pandas Ops</text>
  <text x="400" y="138" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#f43f5e">Instant</text>

  <!-- Bar Chart -->
  <rect x="85" y="170" width="210" height="120" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <line x1="105" y1="265" x2="275" y2="265" stroke="#334155" stroke-width="1"/>
  <!-- Bars -->
  <rect x="115" y="210" width="22" height="55" rx="3" fill="#b6ff00"/>
  <rect x="150" y="190" width="22" height="75" rx="3" fill="#38bdf8"/>
