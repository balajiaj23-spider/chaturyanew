<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradWeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e11"/>
      <stop offset="100%" stop-color="#16181d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#bgGradWeb)"/>
  <rect x="20" y="20" width="760" height="410" rx="12" fill="none" stroke="#252830" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect x="50" y="50" width="700" height="40" rx="8" fill="#1b1e24"/>
  <circle cx="80" cy="70" r="6" fill="#ff5f56"/>
  <circle cx="100" cy="70" r="6" fill="#ffbd2e"/>
  <circle cx="120" cy="70" r="6" fill="#27c93f"/>
  <rect x="150" y="60" width="400" height="20" rx="5" fill="#121418"/>
  <text x="350" y="74" fill="#8b949e" font-family="'Inter', system-ui, sans-serif" font-size="12" text-anchor="middle">https://webstart.chathuryaclub.org</text>
  
  <!-- Browser Body Content -->
  <rect x="50" y="100" width="700" height="300" rx="8" fill="#121418"/>
  
  <text x="90" y="160" fill="#b6ff00" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="800">WebStart 2.0</text>
  <text x="90" y="195" fill="#e6edf3" font-family="'Inter', system-ui, sans-serif" font-size="16">Beginner Web Development Workshop</text>
  
  <!-- Mock Web Elements -->
  <rect x="90" y="220" width="160" height="140" rx="10" fill="#1b1e24" stroke="#b6ff00" stroke-width="1.5"/>
  <text x="170" y="270" fill="#b6ff00" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">&lt;HTML5&gt;</text>
  <text x="170" y="300" fill="#8b949e" font-family="'Inter', system-ui, sans-serif" font-size="13" text-anchor="middle">Structure</text>
  
  <rect x="270" y="220" width="160" height="140" rx="10" fill="#1b1e24" stroke="#3776ab" stroke-width="1.5"/>
  <text x="350" y="270" fill="#3776ab" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">#CSS3</text>
  <text x="350" y="300" fill="#8b949e" font-family="'Inter', system-ui, sans-serif" font-size="13" text-anchor="middle">Styling &amp; Flex</text>
  
  <rect x="450" y="220" width="160" height="140" rx="10" fill="#1b1e24" stroke="#ffd43b" stroke-width="1.5"/>
  <text x="530" y="270" fill="#ffd43b" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">JS { }</text>
  <text x="530" y="300" fill="#8b949e" font-family="'Inter', system-ui, sans-serif" font-size="13" text-anchor="middle">Interactivity</text>
