{% extends 'workshop/base.html' %}
{% load static %}

{% block title %}Change Admin Credentials — {{ site_settings.club_name }}{% endblock %}

{% block content %}
<section class="py-4 py-md-5">
  <div class="container" style="max-width: 600px;">
    
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4 p-3 rounded bg-body-tertiary border border-secondary-subtle shadow-sm">
      <div>
        <span class="badge bg-secondary text-light mb-1">Administrator Security</span>
        <h2 class="h4 fw-bold text-light mb-0">Change Admin Credentials</h2>
      </div>
      <div>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-light btn-sm fw-semibold">← Back to Dashboard</a>
      </div>
    </div>

    <div class="card bg-body-tertiary text-light border border-secondary-subtle p-3 p-md-4 shadow-sm">
      <form method="POST" action="{% url 'admin_change_credentials' %}">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label small text-secondary fw-semibold">Current Username</label>
          <input type="text" class="form-control bg-dark text-light border-secondary" value="{{ request.user.username }}" readonly disabled>
        </div>

        <div class="mb-3">
          <label for="new_username" class="form-label small text-secondary fw-semibold">New Username</label>
          <input type="text" id="new_username" name="new_username" class="form-control bg-dark text-light border-secondary" value="{{ request.user.username }}" required>
          <div class="form-text text-muted small">Enter your desired login username.</div>
        </div>

        <div class="mb-3">
          <label for="current_password" class="form-label small text-secondary fw-semibold">Current Password <span class="text-danger">*</span></label>
          <input type="password" id="current_password" name="current_password" class="form-control bg-dark text-light border-secondary" required placeholder="Enter your current password">
        </div>

        <div class="mb-3">
          <label for="new_password" class="form-label small text-secondary fw-semibold">New Password (Leave blank to keep current)</label>
          <input type="password" id="new_password" name="new_password" class="form-control bg-dark text-light border-secondary" placeholder="Enter new password">
        </div>

        <div class="mb-4">
          <label for="confirm_password" class="form-label small text-secondary fw-semibold">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control bg-dark text-light border-secondary" placeholder="Confirm new password">
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary fw-bold text-dark py-2" style="background: var(--accent); border: none;">Save New Credentials →</button>
        </div>
      </form>
    </div>

  </div>
</section>
{% endblock %}
