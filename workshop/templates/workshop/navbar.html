{% load static %}
<!-- ==================== STICKY NAVBAR ==================== -->
<header class="navbar">
  <div class="container">
    <div class="nav-brand-wrapper">
      <a href="{% url 'home' %}" class="nav-brand">
        <img src="{% static 'images/chathurya-mark.png' %}" alt="Chathurya Logo Mark" class="brand-mark">
        <div class="brand-text">
          <span class="brand-title">CHATHURYA</span>
          <span class="brand-subtitle">STUDENT DEVELOPERS CLUB</span>
        </div>
      </a>
    </div>

    <!-- Main Navigation Menu (Centered) -->
    <nav class="nav-menu">
      <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" data-nav="home">Home</a>
      <a href="{% url 'home' %}#about" class="nav-link" data-nav="about">About Us</a>
      <a href="{% url 'home' %}#events" class="nav-link" data-nav="events">Previous Events</a>
      <a href="{% url 'courses_list' %}" class="nav-link {% if request.resolver_match.url_name == 'courses_list' or request.resolver_match.url_name == 'course_detail' %}active{% endif %}" data-nav="courses">Courses</a>
    </nav>

    <!-- Header Actions (Right Side Buttons) -->
    <div class="nav-actions">
      <button type="button" class="theme-toggle-btn" aria-label="Toggle dark/light theme" title="Toggle theme">☀️</button>
      {% if user.is_authenticated and user.is_staff %}
        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary btn-sm">Admin Dashboard</a>
      {% else %}
        <a href="{% url 'admin_login' %}" class="btn btn-secondary btn-sm">Admin Login</a>
      {% endif %}
      <a href="{% url 'registration' %}" class="btn btn-primary btn-sm">Register Now</a>
    </div>
</header>

<!-- ==================== MOBILE FLOATING NAVIGATION ==================== -->
<nav class="mobile-floating-nav" aria-label="Mobile Navigation">

    <a href="{% url 'home' %}"
       class="mobile-nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
       data-nav="home">
        <span class="mobile-nav-icon">⌂</span>
        <span class="mobile-nav-label">Home</span>
    </a>

    <a href="{% url 'home' %}#about"
       class="mobile-nav-item"
       data-nav="about">
        <span class="mobile-nav-icon">◉</span>
        <span class="mobile-nav-label">About</span>
    </a>

    <a href="{% url 'home' %}#events"
       class="mobile-nav-item"
       data-nav="events">
        <span class="mobile-nav-icon">◈</span>
        <span class="mobile-nav-label">Events</span>
    </a>

    <a href="{% url 'courses_list' %}"
       class="mobile-nav-item {% if request.resolver_match.url_name == 'courses_list' or request.resolver_match.url_name == 'course_detail' %}active{% endif %}"
       data-nav="courses">
        <span class="mobile-nav-icon">▣</span>
        <span class="mobile-nav-label">Courses</span>
    </a>

    <a href="{% url 'registration' %}"
       class="mobile-nav-item mobile-register-item {% if request.resolver_match.url_name == 'registration' or request.resolver_match.url_name == 'registration_success' %}active{% endif %}"
       data-nav="register">
        <span class="mobile-nav-icon">+</span>
        <span class="mobile-nav-label">Join</span>
    </a>

</nav>
