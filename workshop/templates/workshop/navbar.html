{% load static %}
<!-- ==================== STICKY NAVBAR ==================== -->
<header class="navbar">
  <div class="container">
    <a href="{% url 'home' %}" class="nav-brand">
      {% if site_settings.logo %}
        <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.club_name }} Logo">
      {% else %}
        <img src="{% static 'images/logo.svg' %}" alt="{{ site_settings.club_name }} Logo">
      {% endif %}
    </a>

    <nav class="nav-menu">
      <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
      <a href="{% url 'home' %}#about" class="nav-link">About Us</a>
      <a href="{% url 'home' %}#events" class="nav-link">Previous Events</a>
      <a href="{% url 'courses_list' %}" class="nav-link {% if request.resolver_match.url_name == 'courses_list' %}active{% endif %}">Courses</a>
      <a href="{% url 'registration' %}" class="nav-link {% if request.resolver_match.url_name == 'registration' %}active{% endif %}">Register</a>
    </nav>

    <div class="nav-actions">
      <button type="button" class="theme-toggle-btn" aria-label="Toggle dark/light theme" title="Toggle theme">☀️</button>
      <a href="{% url 'registration' %}" class="btn btn-primary btn-sm">Register Now</a>
      <button type="button" class="mobile-toggle" aria-label="Toggle mobile navigation menu" aria-expanded="false">☰</button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-nav-drawer">
    <a href="{% url 'home' %}" class="nav-link">Home</a>
    <a href="{% url 'home' %}#about" class="nav-link">About Us</a>
    <a href="{% url 'home' %}#events" class="nav-link">Previous Events</a>
    <a href="{% url 'courses_list' %}" class="nav-link">Courses</a>
    <a href="{% url 'registration' %}" class="nav-link">Register</a>
    <a href="{% url 'registration' %}" class="btn btn-primary btn-block">Register Now</a>
  </div>
</header>
