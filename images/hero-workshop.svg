<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6ff00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b6ff00" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" rx="20" fill="url(#bgGrad)" stroke="#262626" stroke-width="2"/>
  <rect width="600" height="450" rx="20" fill="url(#accentGlow)"/>

  <!-- Code Editor Window -->
  <rect x="40" y="40" width="520" height="370" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Window Header -->
  <rect x="40" y="40" width="520" height="40" rx="12" fill="#1e1e1e"/>
  <rect x="40" y="68" width="520" height="12" fill="#1e1e1e"/>
  <circle cx="65" cy="60" r="5" fill="#ff5f56"/>
  <circle cx="82" cy="60" r="5" fill="#ffbd2e"/>
  <circle cx="99" cy="60" r="5" fill="#27c93f"/>
  <text x="230" y="64" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#71717a">workshop_session.js — Technical Club</text>

  <!-- Code Snippet Lines -->
  <text x="65" y="115" font-family="monospace" font-size="13" fill="#b6ff00">const<tspan fill="#ffffff"> workshop = </tspan>new<tspan fill="#60a5fa"> TechnicalWorkshop</tspan><tspan fill="#ffffff">({</tspan></text>
  <text x="85" y="145" font-family="monospace" font-size="13" fill="#a0a0a0">title: <tspan fill="#facc15">"Full Stack &amp; Data Analytics 2026"</tspan>,</text>
  <text x="85" y="175" font-family="monospace" font-size="13" fill="#a0a0a0">duration: <tspan fill="#facc15">"5-Day Intensive Hands-on"</tspan>,</text>
  <text x="85" y="205" font-family="monospace" font-size="13" fill="#a0a0a0">mode: <tspan fill="#facc15">"Live Code &amp; Build Real Projects"</tspan>,</text>
  <text x="85" y="235" font-family="monospace" font-size="13" fill="#a0a0a0">status: <tspan fill="#b6ff00">"Registration Open"</tspan></text>
  <text x="65" y="265" font-family="monospace" font-size="13" fill="#ffffff">});</text>

  <text x="65" y="305" font-family="monospace" font-size="13" fill="#60a5fa">await <tspan fill="#ffffff">workshop.</tspan><tspan fill="#b6ff00">launchStudentProjects</tspan><tspan fill="#ffffff">();</tspan></text>
  <text x="65" y="335" font-family="monospace" font-size="13" fill="#4ade80">// Console: Successfully registered 500+ student developers!</text>

  <!-- Floating Tech Badges -->
  <g transform="translate(360, 240)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="48" rx="24" fill="#1f2417" stroke="#b6ff00" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="#b6ff00"/>
    <path d="M 20 24 L 23 27 L 29 21" stroke="#111111" stroke-width="2.5" fill="none"/>
    <text x="45" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">100% Practical</text>
  </g>

  <g transform="translate(330, 310)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="48" rx="24" fill="#181818" stroke="#333333" stroke-width="1.5"/>
    <text x="20" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#b6ff00">⚡ HTML • JS • Python • SQL</text>
  </g>
</svg>
